apiVersion: v1alpha1
kind: Setting
metadata:
  name: link-submit-next-settings
spec:
  forms:
    - group: basic
      label: 前台增强
      formSchema:
        - $formkit: switch
          name: loadPlugInResources
          id: loadPlugInResources
          label: 加载插件资源
          help: 在友链页加载增强申请弹窗；申请数据、审核和通知由 Halo 官方链接插件负责
          value: true
        - $formkit: switch
          if: $get(loadPlugInResources).value
          name: displayTheSubmitButton
          id: displayTheSubmitButton
          key: displayTheSubmitButton
          label: 显示提交按钮
          help: 主题已经提供申请按钮时可关闭，仍可通过 LinkSubmitWidget.open() 打开弹窗
          value: true
        - $formkit: switch
          name: enableLinkPreview
          label: 自动获取网站信息
          help: 允许访客通过服务端安全代理获取网站标题、描述和 Logo；不会代替官方申请校验
          value: true
