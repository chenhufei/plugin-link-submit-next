apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-link-submit-next-anonymous
  labels:
    halo.run/hidden: "true"
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
  annotations:
    rbac.authorization.halo.run/module: "PluginLinkSubmitAnonymous"
    rbac.authorization.halo.run/display-name: "PluginLinkSubmit Anonymous AccessRole"
rules:
  - apiGroups: [ "api.link.submit.halo.run" ]
    resources: [ "configuration", "site-info" ]
    verbs: [ "get", "list" ]
  - nonResourceURLs:
      - "/apis/api.link.submit.halo.run/v1alpha1/configuration"
      - "/apis/api.link.submit.halo.run/v1alpha1/site-info"
    verbs: [ "get" ]


---

apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-link-submit-next-view
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "友链申请增强"
    rbac.authorization.halo.run/display-name: "友链申请增强查看"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:link:submit-next:view"]
rules:
  - apiGroups: [ "link.submit.halo.run" ]
    resources: [ "linksubmits" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "console.api.link.submit.halo.run" ]
    resources: [ "linksubmits"]
    verbs: [ "get", "list" ]

---
