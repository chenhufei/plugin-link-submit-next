apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-admin-link-submit
spec:
  reasonSelector:
    reasonType: admin-link-submit
    language: default
  template:
    title: "新的友链[(${type == 'update' ? '修改' : '提交'})]申请待处理"
    rawBody: |
      [(${subscriber.displayName})]，您好：

      收到新的友链[(${type == 'update' ? '修改' : '提交'})]申请。
      网站名称：[(${displayName})]
      网站地址：[(${url})]
      [# th:if="${oldUrl != null and oldUrl != ''}"]原网站地址：[(${oldUrl})][/]
      分组：[(${groupName})]
      联系邮箱：[(${email})]
      [# th:if="${description != null and description != ''}"]网站描述：[(${description})][/]
      [# th:if="${rssUrl != null and rssUrl != ''}"]RSS 地址：[(${rssUrl})][/]
      [# th:if="${message != null and message != ''}"]申请留言：[(${message})][/]
      提交时间：[(${submittedAt})]
      当前状态：[(${review ? '已自动通过' : '待审核'})]

      审核入口：[(${reviewUrl})]
    htmlBody: |
      <div style="max-width:640px;margin:0 auto;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;line-height:1.7;">
        <div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#ffffff;">
          <div style="padding:22px 24px;background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <div style="font-size:13px;color:#64748b;">友链自助提交</div>
            <h2 style="margin:4px 0 0;font-size:20px;line-height:1.4;color:#111827;" th:text="|新的友链${type == 'update' ? '修改' : '提交'}申请|">新的友链申请</h2>
            <span style="display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:12px;font-weight:600;" th:text="${review ? '已自动通过' : '待审核'}">待审核</span>
          </div>
          <div style="padding:22px 24px;">
            <p style="margin:0 0 16px;" th:text="|${subscriber.displayName}，您好：|">您好：</p>
            <table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;">
              <tr><td style="width:96px;padding:8px 0;color:#64748b;vertical-align:top;">网站名称</td><td style="padding:8px 0;color:#111827;font-weight:600;" th:text="${displayName}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;vertical-align:top;">网站地址</td><td style="padding:8px 0;word-break:break-all;"><a th:href="${url}" th:text="${url}" target="_blank" rel="noopener noreferrer" style="color:#2563eb;"></a></td></tr>
              <tr th:if="${oldUrl != null and oldUrl != ''}"><td style="padding:8px 0;color:#64748b;vertical-align:top;">原网站地址</td><td style="padding:8px 0;word-break:break-all;" th:text="${oldUrl}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;vertical-align:top;">申请类型</td><td style="padding:8px 0;" th:text="${type == 'update' ? '修改友链' : '新增友链'}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;vertical-align:top;">申请分组</td><td style="padding:8px 0;" th:text="${groupName}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;vertical-align:top;">联系邮箱</td><td style="padding:8px 0;word-break:break-all;" th:text="${email}"></td></tr>
              <tr th:if="${description != null and description != ''}"><td style="padding:8px 0;color:#64748b;vertical-align:top;">网站描述</td><td style="padding:8px 0;" th:text="${description}"></td></tr>
              <tr th:if="${rssUrl != null and rssUrl != ''}"><td style="padding:8px 0;color:#64748b;vertical-align:top;">RSS 地址</td><td style="padding:8px 0;word-break:break-all;" th:text="${rssUrl}"></td></tr>
              <tr th:if="${message != null and message != ''}"><td style="padding:8px 0;color:#64748b;vertical-align:top;">申请留言</td><td style="padding:8px 0;" th:text="${message}"></td></tr>
              <tr th:if="${submittedAt != null and submittedAt != ''}"><td style="padding:8px 0;color:#64748b;vertical-align:top;">提交时间</td><td style="padding:8px 0;" th:text="${submittedAt}"></td></tr>
            </table>
            <p style="margin:20px 0 0;"><a th:href="${reviewUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:9px 16px;border-radius:6px;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:600;">前往审核</a></p>
          </div>
        </div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-user-link-submit
spec:
  reasonSelector:
    reasonType: user-link-submit
    language: default
  template:
    title: "您的友链[(${type == 'update' ? '修改' : '提交'})]申请已收到"
    rawBody: |
      [(${subscriber.displayName})]，您好：

      您的友链申请已经提交，请等待管理员审核。
      网站名称：[(${displayName})]
      网站地址：[(${url})]
      分组：[(${groupName})]
      当前状态：待审核
    htmlBody: |
      <div style="max-width:640px;margin:0 auto;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;line-height:1.7;">
        <div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#ffffff;">
          <div style="padding:22px 24px;background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <div style="font-size:13px;color:#64748b;">友链自助提交</div>
            <h2 style="margin:4px 0 0;font-size:20px;color:#111827;">申请已收到</h2>
            <span style="display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:12px;font-weight:600;">待审核</span>
          </div>
          <div style="padding:22px 24px;">
            <p style="margin:0 0 16px;" th:text="|${subscriber.displayName}，您好：|">您好：</p>
            <table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;">
              <tr><td style="width:96px;padding:8px 0;color:#64748b;">网站名称</td><td style="padding:8px 0;font-weight:600;" th:text="${displayName}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;vertical-align:top;">网站地址</td><td style="padding:8px 0;word-break:break-all;"><a th:href="${url}" th:text="${url}" target="_blank" rel="noopener noreferrer" style="color:#2563eb;"></a></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">申请类型</td><td style="padding:8px 0;" th:text="${type == 'update' ? '修改友链' : '新增友链'}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">申请分组</td><td style="padding:8px 0;" th:text="${groupName}"></td></tr>
              <tr th:if="${description != null and description != ''}"><td style="padding:8px 0;color:#64748b;vertical-align:top;">网站描述</td><td style="padding:8px 0;" th:text="${description}"></td></tr>
            </table>
            <p style="margin:18px 0 0;color:#64748b;font-size:13px;">审核完成后，我们会再次通过邮件通知您。</p>
          </div>
        </div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-review-link-submit
spec:
  reasonSelector:
    reasonType: review-link-submit
    language: default
  template:
    title: "您的友链申请[(${through ? '已通过' : '未通过'})]"
    rawBody: |
      [(${subscriber.displayName})]，您好：

      您的友链[(${type == 'update' ? '修改' : '提交'})]申请[(${through ? '已通过审核' : '未通过审核'})]。
      网站名称：[(${displayName})]
      网站地址：[(${url})]
      分组：[(${groupName})]
      审核说明：[(${reviewDescription != null and reviewDescription != '' ? reviewDescription : '无'})]
    htmlBody: |
      <div style="max-width:640px;margin:0 auto;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;line-height:1.7;">
        <div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#ffffff;">
          <div style="padding:22px 24px;background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <div style="font-size:13px;color:#64748b;">友链自助提交</div>
            <h2 style="margin:4px 0 0;font-size:20px;color:#111827;" th:text="${through ? '申请已通过' : '申请未通过'}">审核结果</h2>
            <span style="display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;" th:style="${through ? 'background:#ecfdf5;color:#047857;' : 'background:#fef2f2;color:#b91c1c;'}" th:text="${through ? '已通过' : '未通过'}"></span>
          </div>
          <div style="padding:22px 24px;">
            <p style="margin:0 0 16px;" th:text="|${subscriber.displayName}，您好：|">您好：</p>
            <table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;">
              <tr><td style="width:96px;padding:8px 0;color:#64748b;">网站名称</td><td style="padding:8px 0;font-weight:600;" th:text="${displayName}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;vertical-align:top;">网站地址</td><td style="padding:8px 0;word-break:break-all;"><a th:href="${url}" th:text="${url}" target="_blank" rel="noopener noreferrer" style="color:#2563eb;"></a></td></tr>
              <tr th:if="${oldUrl != null and oldUrl != ''}"><td style="padding:8px 0;color:#64748b;vertical-align:top;">原网站地址</td><td style="padding:8px 0;word-break:break-all;" th:text="${oldUrl}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">申请分组</td><td style="padding:8px 0;" th:text="${groupName}"></td></tr>
              <tr th:if="${description != null and description != ''}"><td style="padding:8px 0;color:#64748b;vertical-align:top;">网站描述</td><td style="padding:8px 0;" th:text="${description}"></td></tr>
            </table>
            <div style="margin-top:18px;padding:12px 14px;border-radius:6px;background:#f8fafc;border-left:4px solid #94a3b8;">
              <div style="font-size:12px;color:#64748b;">审核说明</div>
              <div style="margin-top:4px;color:#111827;" th:text="${reviewDescription != null and reviewDescription != '' ? reviewDescription : '无'}"></div>
            </div>
          </div>
        </div>
      </div>
