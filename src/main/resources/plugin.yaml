apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: link-submit-next
spec:
  enabled: true
  requires: ">=2.27.0"
  pluginDependencies:
    "PluginLinks": ">=2.3.0 & <3.0.0"
  version: "2.0.4"
  author:
    name: chenhufei
    website: https://github.com/chenhufei
  logo: logo.svg
  homepage: https://github.com/chenhufei/plugin-link-submit-next
  repo: https://github.com/chenhufei/plugin-link-submit-next
  issues: https://github.com/chenhufei/plugin-link-submit-next/issues
  configMapName: link-submit-next-configmap
  settingName: link-submit-next-settings
  displayName: "友链申请增强"
  description: "Halo 官方链接插件的前台申请增强层：访客在官方申请表单填入网址后，可一键通过服务端安全代理获取网站标题、描述和 Logo 并自动填充。申请表单、提交、验证码、审核、通知与正式友链数据均由 PluginLinks 负责。"
  license:
    - name: "GPL-3.0"
      url: "https://www.gnu.org/licenses/gpl-3.0.html"
