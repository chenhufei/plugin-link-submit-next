plugins {
    id 'java'
    id "io.freefair.lombok" version "8.13"
    id "run.halo.plugin.devtools" version "0.6.1"
}

group 'run.halo.linksubmit'
version '1.2.3'

repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org/content/repositories/releases' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.25.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('buildFrontend')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
    dependsOn project(':packages:link-submit-widget').tasks.named('build')
}

halo {
    version = '2.25.0'
}

tasks.register('verifyVersionConsistency') {
    group = 'verification'
    description = 'Verify plugin.yaml version matches the Gradle project version.'
    inputs.files(
        layout.projectDirectory.file('src/main/resources/plugin.yaml'),
        layout.projectDirectory.file('packages/link-submit-widget/package.json')
    )
    doLast {
        def expectedVersion = project.version.toString()
        def pluginYaml = layout.projectDirectory
            .file('src/main/resources/plugin.yaml').asFile.getText('UTF-8')
        def versionMatcher = pluginYaml =~ /(?m)^\s{2}version:\s*["']?([^"'\s]+)["']?\s*$/
        if (!versionMatcher.find()) {
            throw new GradleException('Unable to read spec.version from plugin.yaml')
        }
        def pluginVersion = versionMatcher.group(1)
        if (pluginVersion != expectedVersion) {
            throw new GradleException(
                "Version mismatch: Gradle=${expectedVersion}, plugin.yaml=${pluginVersion}"
            )
        }
        def widgetPackage = new groovy.json.JsonSlurper().parse(
            layout.projectDirectory.file('packages/link-submit-widget/package.json').asFile
        )
        if (widgetPackage.version?.toString() != expectedVersion) {
            throw new GradleException(
                "Version mismatch: Gradle=${expectedVersion}, widget=${widgetPackage.version}"
            )
        }
    }
}

tasks.register('verifyPublicationMetadata') {
    group = 'verification'
    description = 'Reject placeholder store metadata and preserve source attribution.'
    inputs.files(
        layout.projectDirectory.file('src/main/resources/plugin.yaml'),
        layout.projectDirectory.file('packages/link-submit-widget/package.json'),
        layout.projectDirectory.file('README.md')
    )
    doLast {
        def pluginYaml = layout.projectDirectory
            .file('src/main/resources/plugin.yaml').asFile.getText('UTF-8')
        if (pluginYaml =~ /store\.halo\.run\/app-id:\s*["']?app-(?:link-submit-next|TODO|CHANGE_ME)["']?/) {
            throw new GradleException('Plugin metadata contains a placeholder or upstream store app id.')
        }
        def widgetPackage = new groovy.json.JsonSlurper().parse(
            layout.projectDirectory.file('packages/link-submit-widget/package.json').asFile
        )
        if (widgetPackage.name.toString().startsWith('@halo-dev/')) {
            throw new GradleException('The widget package must not use the @halo-dev namespace.')
        }
        if (widgetPackage.author?.url?.toString() != 'https://github.com/chenhufei') {
            throw new GradleException('Widget author metadata must identify the current maintainer.')
        }
        def contributors = widgetPackage.contributors*.url*.toString()
        if (!contributors.contains('https://github.com/chengzhongxue')) {
            throw new GradleException('Widget metadata must retain the upstream author attribution.')
        }
        def readme = layout.projectDirectory.file('README.md').asFile.getText('UTF-8')
        ['chengzhongxue/link-submit', 'PluginLinks'].each { marker ->
            if (!readme.contains(marker)) {
                throw new GradleException("README is missing required source/boundary attribution: ${marker}")
            }
        }
    }
}

tasks.register('verifyEnhancementBoundary') {
    group = 'verification'
    description = 'Ensure the plugin remains an enhancement for official PluginLinks.'
    inputs.files(
        layout.projectDirectory.file('src/main/java/run/halo/linksubmit/endpoint/AnonymousEndpoint.java'),
        layout.projectDirectory.file('src/main/java/run/halo/linksubmit/endpoint/LinkSubmitEndpoint.java'),
        layout.projectDirectory.file('src/main/java/run/halo/linksubmit/LinkSubmitReconciler.java'),
        layout.projectDirectory.file('src/main/java/run/halo/linksubmit/NotificationReasonPublisher.java'),
        layout.projectDirectory.file('ui/src/views/HomeView.vue'),
        layout.projectDirectory.file('packages/link-submit-widget/src/link-submit-modal.ts'),
        layout.projectDirectory.file('src/main/resources/plugin.yaml')
    )
    doLast {
        def anonymousEndpoint = layout.projectDirectory
            .file('src/main/java/run/halo/linksubmit/endpoint/AnonymousEndpoint.java')
            .asFile.getText('UTF-8')
        def consoleEndpoint = layout.projectDirectory
            .file('src/main/java/run/halo/linksubmit/endpoint/LinkSubmitEndpoint.java')
            .asFile.getText('UTF-8')
        ['linksubmits/-/submit', '.POST("linksubmits'].each { forbidden ->
            if (anonymousEndpoint.contains(forbidden) || consoleEndpoint.contains(forbidden)) {
                throw new GradleException("Legacy link submission write API is forbidden: ${forbidden}")
            }
        }

        [
            'src/main/java/run/halo/linksubmit/LinkSubmitReconciler.java',
            'src/main/java/run/halo/linksubmit/NotificationReasonPublisher.java'
        ].each { path ->
            def source = layout.projectDirectory.file(path).asFile.getText('UTF-8')
            if (source =~ /(?m)^\s*@Component\s*$/) {
                throw new GradleException("Legacy side-effect component must stay disabled: ${path}")
            }
        }

        def homeView = layout.projectDirectory.file('ui/src/views/HomeView.vue')
            .asFile.getText('UTF-8')
        ['SubmitList', '<Cron', '定时任务'].each { forbidden ->
            if (homeView.contains(forbidden)) {
                throw new GradleException("Enhancement console must not expose legacy workflow: ${forbidden}")
            }
        }

        def widget = layout.projectDirectory
            .file('packages/link-submit-widget/src/link-submit-modal.ts').asFile.getText('UTF-8')
        ['api.link.halo.run/v1alpha1/link-applications', '/captcha'].each { required ->
            if (!widget.contains(required)) {
                throw new GradleException("Widget must use official PluginLinks API: ${required}")
            }
        }

        def pluginYaml = layout.projectDirectory.file('src/main/resources/plugin.yaml')
            .asFile.getText('UTF-8')
        if (!pluginYaml.contains('"PluginLinks": ">=2.3.0"')) {
            throw new GradleException('PluginLinks dependency must require the verified 2.3.0 API')
        }
    }
}

tasks.named('check') {
    dependsOn('verifyVersionConsistency')
    dependsOn('verifyPublicationMetadata')
    dependsOn('verifyEnhancementBoundary')
    dependsOn project(':packages:link-submit-widget').tasks.named('testFrontend')
}

haloPlugin {
    openApi {
        outputDir = file("$rootDir/api-docs/openapi/v3_0")
        // 用于定义 API 分组规则
        groupingRules {
            // 此名称为 group name，定义后 groupedApiMappings 中的 /v3/api-docs/ 后的名称需要与之相同，要避免与 halo 中已经存在的 group 相同避免生成后出现与插件无关的 API
            linkSubmitApi {
                // 分组显示名称
                displayName = 'Extension API for Plugin linkSubmit'
                // 分组的 API 规则
                pathsToMatch = ["/apis/link.submit.halo.run/v1alpha1/**",
                                "/apis/console.api.link.submit.halo.run/v1alpha1/**"
                ]
            }
        }
        groupedApiMappings = [
                '/v3/api-docs/linkSubmitApi': 'linkSubmitApi.json'
        ]
        generator {
            // 默认配置可缺省
            outputDir = file("${projectDir}/ui/src/api/generated")
        }
    }

}
